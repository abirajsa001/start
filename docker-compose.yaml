version: "3.8"

services:
  jwt-server:
    image: node:20-alpine
    container_name: jwt-server
    restart: always
    command:
      - npx
      - --yes
      - jwt-mock-server
      - start
    ports:
      - "9002:9000"

  processor:
    image: node:20-alpine
    container_name: processor
    working_dir: /home/node/app
    volumes:
      - ./processor:/home/node/app
    depends_on:
      - jwt-server
    env_file:
      - ./processor/.env
    environment:
      CTP_JWKS_URL: http://jwt-server:9000/jwt/.well-known/jwks.json
      CTP_JWT_ISSUER: https://issuer.com
    command: >
      sh -c "npm install && npm run watch"
    ports:
      - "8080:8080"

  enabler:
    image: node:20-alpine
    container_name: enabler
    working_dir: /home/node/app
    volumes:
      - ./enabler:/home/node/app
    depends_on:
      - processor
    env_file:
      - ./enabler/.env
    environment:
      VITE_PROCESSOR_URL: http://processor:8080
    command: >
      sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
